<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>BMI Calculator</h2>
    <form>
      <label for="height">Height (cm):</label>
      <input type="number" id="height" placeholder="Enter height in cm" required />

      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" placeholder="Enter weight in kg" required />

      <button type="submit">Calculate BMI</button>
    </form>

    <div id="results"></div>
  </div>

  <script>
    const form = document.querySelector('form');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const height = parseInt(document.querySelector('#height').value);
      const weight = parseInt(document.querySelector('#weight').value);
      const results = document.querySelector('#results');

      if (height === '' || height <= 0 || isNaN(height)) {
        results.innerHTML = `Please give a valid height: ${height}`;
      } else if (weight === '' || weight <= 0 || isNaN(weight)) {
        results.innerHTML = `Please give a valid weight: ${weight}`;
      } else {
        const bmi = (weight / ((height * height) / 10000)).toFixed(2);
        let message = `Your BMI is <strong>${bmi}</strong><br/>`;

        if (bmi < 18.5) {
          message += "You are Underweight 🟡";
        } else if (bmi >= 18.5 && bmi <= 24.9) {
          message += "You have Normal BMI ✅";
        } else {
          message += "You are Overweight 🔴";
        }

        results.innerHTML = message;
      }
    });
  </script>
</body>
</html>
